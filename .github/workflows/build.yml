name: build

on:
  push:
    paths:
      - 'TwitchIntegration/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'TwitchIntegration/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: TwitchIntegration/bridge -> target

      - name: Rust tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo test --manifest-path TwitchIntegration/bridge/Cargo.toml

      # Each jar contains only the bridge compiled on this runner, so the
      # artifacts are platform-specific. Manual bridge mode works everywhere.
      - name: Build mod
        shell: bash
        run: ./gradlew :twitchintegration:build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: twitchintegration-${{ matrix.name }}
          path: TwitchIntegration/build/libs/*.jar
          if-no-files-found: error
